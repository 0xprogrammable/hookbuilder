name: Release rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-rehearsal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rehearse:
    name: Exact public main release rehearsal
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout exact dispatched revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind rehearsal to protected public main
        env:
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_REVISION"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install root lockfile without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1
      - name: Preload the portable-test Solidity compiler
        run: |
          mkdir -p -- "$RUNNER_TEMP/programmable-foundry-bootstrap"
          forge build --use 0.8.26 --root "$RUNNER_TEMP/programmable-foundry-bootstrap"
      - name: Use Python for Slither
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install pinned Slither
        run: python -m pip install --disable-pip-version-check slither-analyzer==0.11.5
      - name: Derive the closed release identity
        id: release
        run: |
          RELEASE_TAG="$(node --input-type=module -e 'import fs from "node:fs"; const value = JSON.parse(fs.readFileSync("config/plugin.json", "utf8")).version; if (!/^(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)$/u.test(value)) process.exit(1); process.stdout.write(`v${value}`)')"
          RELEASE_OUTPUT="$RUNNER_TEMP/programmable-v4-builder-$RELEASE_TAG-$GITHUB_SHA"
          test ! -e "$RELEASE_OUTPUT"
          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          printf 'output=%s\n' "$RELEASE_OUTPUT" >> "$GITHUB_OUTPUT"
      - name: Run the unchanged complete release rehearsal
        env:
          RELEASE_OUTPUT: ${{ steps.release.outputs.output }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          XDG_STATE_HOME: ${{ runner.temp }}/programmable-release-state
        run: npm run release:candidate -- --tag "$RELEASE_TAG" --output-dir "$RELEASE_OUTPUT"
      - name: Verify the bound rehearsal output and clean source
        env:
          RELEASE_OUTPUT: ${{ steps.release.outputs.output }}
        run: |
          test -f "$RELEASE_OUTPUT/local-release-verification.json"
          test -f "$RELEASE_OUTPUT/kernel-release-evidence.json"
          test -f "$RELEASE_OUTPUT/artifacts/SHA256SUMS"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Preserve the exact rehearsal output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-rehearsal-${{ steps.release.outputs.tag }}-${{ github.sha }}
          path: ${{ steps.release.outputs.output }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
