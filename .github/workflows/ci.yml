name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Repository and skill / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install root lockfile without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run complete deterministic repository gate
        run: npm test
      - name: Validate Agent Skills publication shape
        if: matrix.node == 22
        run: gh skill publish --dry-run

  reference-kernel:
    name: Reference fee kernel
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: skills/programmable-v4-hook-builder/assets/reference-kernels/programmable-volume-fee-v1
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: skills/programmable-v4-hook-builder/assets/reference-kernels/programmable-volume-fee-v1/package-lock.json
      - name: Install exact Solidity packages without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: stable
      - name: Check formatting
        run: forge fmt --check
      - name: Build exact profile
        run: forge build
      - name: Run unit, fuzz and invariant tests
        run: forge test -vvv
      - name: Use Python for Slither
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned Slither
        run: python -m pip install --disable-pip-version-check slither-analyzer==0.11.5
      - name: Run Slither without dependency or test findings
        run: slither . --exclude-dependencies --filter-paths 'node_modules|test'

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          languages: javascript-typescript
      - name: Analyze
        uses: github/codeql-action/analyze@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
