        provider: '{{ env.PROGRAMMABLE_EVAL_JUDGE_PROVIDER }}'
      - type: icontains-any
        value:
          - 'CUSTOM_ARCHITECTURE'
          - 'eigene Architektur'
          - 'individuelle Architektur'
      - type: icontains-any
        value:
          - 'verbrenn'
          - 'zerstört'
          - 'für immer weg'
      - type: icontains-any
        value:
          - 'Geldtopf'
          - 'Reserve'
          - 'gedeckt'

