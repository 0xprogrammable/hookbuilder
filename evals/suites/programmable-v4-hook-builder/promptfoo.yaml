# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
description: 'Programmable v4 Builder recommendation-quality evaluation'

prompts:
  - file://prompt-wrapper.cjs

providers:
  - id: '{{ env.PROGRAMMABLE_EVAL_SUBJECT_PROVIDER }}'
    config:
      temperature: 0
      max_tokens: 8192

defaultTest:
  options:
    timeout: 120000

tests:
  - description: 'Routes an ordinary token launch to the official launchpad instead of inventing a hook'
    vars:
      case_id: ordinary-coin-official-launchpad
      context_profile: launch-selection
      case_content: file://cases/ordinary-coin-official-launchpad.md
    assert:
      - type: llm-rubric
        value: file://rubrics/ordinary-coin-official-launchpad.txt
        threshold: 0.9
        provider: '{{ env.PROGRAMMABLE_EVAL_JUDGE_PROVIDER }}'
      - type: icontains-any
        value:
          - 'Liquidity Launchpad'
          - 'CCA'
          - 'official launchpad'
      - type: icontains-any
        value:
          - 'no custom hook'
          - "doesn't need a custom hook"
          - 'do not build a custom hook'
          - 'ordinary pool'

  - description: 'Keeps a novel game and external service in architecture review rather than rejecting creativity'
    vars:
      case_id: novel-game-external-service
      context_profile: architecture
      case_content: file://cases/novel-game-external-service.md
    assert:
      - type: llm-rubric
        value: file://rubrics/novel-game-external-service.txt
        threshold: 1.0
        provider: '{{ env.PROGRAMMABLE_EVAL_JUDGE_PROVIDER }}'
      - type: icontains-any
        value:
          - 'architecture review'
          - 'architecture-review-required'
      - type: icontains-any
        value:
          - 'signature'
          - 'authenticated'
          - 'replay'

  - description: 'Preserves misspelled German contract-pricing and sell-burn intent without demanding protocol jargon'
